services:
  postgres:
    image: postgres:16-alpine
    container_name: gw_exchanger_postgres
    restart: unless-stopped
    env_file:
      - ./gw-exchanger/config.env
    volumes:
      - exchanger-pgdata:/var/lib/postgresql/data
      - ./gw-exchanger/internal/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  gw-exchanger:
    build: 
      context: .
      dockerfile: gw-exchanger/Dockerfile
    container_name: gw_exchanger
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./gw-exchanger/config.env
    ports:
      - "50051:50051"
    restart: unless-stopped

volumes:
  exchanger-pgdata: